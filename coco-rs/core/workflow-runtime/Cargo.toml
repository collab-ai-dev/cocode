[package]
name = "coco-workflow-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
coco-error.workspace = true
coco-stack-trace-macro.workspace = true
coco-types.workspace = true
rquickjs.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-trait.workspace = true
snafu.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
# The bundled `deep-research` harness lives in `coco-workflow`; the
# `tests/deep_research.rs` integration test is the only thing that proves that
# script actually executes in this crate's realm. `coco-workflow` does not
# depend on this crate, so the dev-edge introduces no cycle.
coco-workflow.workspace = true
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
