[profile.default]
# Do not increase, fix your test instead
slow-timeout = { period = "15s", terminate-after = 2 }

# These tests construct complete session/AppServer fixtures or perform
# blocking transcript IO. They finish quickly alone, but can starve behind
# workspace-wide process and filesystem contention. Reserve the full scheduler
# while they run instead of weakening the timeout that catches genuine hangs.
[[profile.default.overrides]]
filter = 'package(coco-cli) & test(/(local_app_server_completes_plain_then_file_mention_turn|idle_queue_processor_starts_pending_prompt_turn)$/)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'package(coco-agent-host) & test(/(targeted_project_and_local_config_writes_cannot_modify_the_sibling_project|local_goal_print_run_writes_resumable_zero_turn_transcript|host_builder_updates_event_hub_membership_from_registry|max_sessions_one_allows_first_real_session_without_placeholder|close_timeout_aborts_active_turn_and_returns_structured_error|close_waits_for_inflight_turn_result_before_final_session_result)$/)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'package(coco-agent-host) & test(/(append_is_additive_across_calls|append_then_load_messages_roundtrip|compact_sidechain_transcript_writes_agent_store_only|fork_creates_new_id_and_copies_jsonl|fork_honors_explicit_session_id|resume_plan_session_seq_watermark_reads_destination_transcript|title_resolution_filters_matches_to_runtime_project)$/)'
threads-required = "num-test-threads"

# `coco-tests-live` is the one package whose tests spawn the real `coco`
# binary (two full process starts per test), so its wall-clock is dominated by
# process startup rather than in-process work. The 15s/30s default above is
# calibrated for in-process tests; under a saturated `pre-commit` run a
# legitimate live run exceeds it, which made these tests fail on machine load
# rather than on behavior.
#
# This is a *scoped category* budget, not a global bump — every other package
# keeps the strict default. It also restores a coherent layering: each test's
# own 90s per-subprocess timeout now fires FIRST with a precise message
# ("coco subprocess timed out"), and nextest's 180s remains the outer
# hang backstop. Previously the order was inverted (nextest's 30s always won),
# so the in-test timeout was unreachable dead code.
[[profile.default.overrides]]
filter = 'package(coco-tests-live)'
slow-timeout = { period = "60s", terminate-after = 3 }
